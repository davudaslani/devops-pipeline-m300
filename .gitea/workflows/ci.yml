name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:

      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Linting (flake8)
        run: |
          flake8 app/app.py --max-line-length=100 --ignore=E501

      - name: Unit Tests
        run: |
          pytest app/tests/ -v --cov=app --cov-report=term-missing

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:

      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker Image bauen
        run: |
          docker build -t flask-app:${{ github.sha }} ./app
          docker tag flask-app:${{ github.sha }} flask-app:latest

      - name: Image testen (Smoke Test)
        run: |
          docker run -d --name test-app -p 5000:5000 flask-app:latest
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop test-app && docker rm test-app

  deploy:
    name: Deploy (lokal)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:

      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Stack neu deployen
        run: |
          docker compose -f docker-compose.yml up -d --build app
          echo "✅ Deployment abgeschlossen: $(date)"
